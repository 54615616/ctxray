[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxray"
version = "1.0.0"
description = "See what your AI sees. AST-aware context compiler, Dependency PageRank budgeter, Interactive X-Ray Studio & MCP Server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ctxray contributors" }]
keywords = ["ai", "llm", "mcp", "context", "ast", "pagerank", "prompt-cache", "claude", "codex", "cursor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
ctxray = "ctxray.cli:main"

[tool.setuptools.packages.find]
include = ["ctxray*"]
