name: Deploy CtxRay Studio to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "studio/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Bundle Studio & SVG Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site bundle (_site)
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/studio _site/assets

          # Copy studio app to both root (/) and /studio/ so direct links and relative asset paths resolve cleanly
          if [ -d studio ]; then
            cp -R studio/. _site/
            cp -R studio/. _site/studio/
          fi

          # Copy SVG visual assets to /assets/ and /studio/assets/
          if [ -d assets ]; then
            cp -R assets/. _site/assets/
            mkdir -p _site/studio/assets
            cp -R assets/. _site/studio/assets/
          fi

          # Prevent Jekyll processing on GitHub Pages
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
