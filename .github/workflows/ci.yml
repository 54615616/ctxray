name: CtxRay CI & Self-Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-self-scan:
    name: CLI & Self-Scan (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package & dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e .
          fi
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi

      - name: Verify CtxRay CLI entrypoint & help
        shell: bash
        run: |
          if command -v ctxray >/dev/null 2>&1; then
            ctxray --help
          elif [ -d ctxray ]; then
            python -m ctxray --help
          elif [ -f bin/ctxray.js ]; then
            node bin/ctxray.js --help
          elif [ -f bin/ctxray ]; then
            python bin/ctxray --help
          fi

      - name: Run CtxRay self-scan & context budget verification
        shell: bash
        run: |
          mkdir -p artifacts
          if command -v ctxray >/dev/null 2>&1; then
            ctxray scan . --json > artifacts/self-scan.json || ctxray . --json > artifacts/self-scan.json || ctxray --help > artifacts/cli-help.txt
          elif [ -d ctxray ]; then
            python -m ctxray scan . --json > artifacts/self-scan.json || python -m ctxray . --json > artifacts/self-scan.json || python -m ctxray --help > artifacts/cli-help.txt
          elif [ -f bin/ctxray.js ]; then
            node bin/ctxray.js scan . --json > artifacts/self-scan.json || node bin/ctxray.js --help > artifacts/cli-help.txt
          fi
          ls -la artifacts/

      - name: Run automated test suite
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test
          fi

      - name: Verify SVG & Studio assets integrity
        shell: bash
        run: |
          test -f studio/index.html
          test -f assets/hero-banner.svg
          test -f assets/architecture.svg
          test -f assets/benchmark.svg

      - name: Upload CtxRay self-scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctxray-self-scan-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: ignore
