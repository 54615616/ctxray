<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="1100" height="320" rx="16" fill="#080C14" stroke="#1E293B" stroke-width="1.5"/>
  <text x="40" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">CTXRAY COMPILATION PIPELINE</text>
  <text x="330" y="42" fill="#64748B" font-family="ui-monospace, monospace" font-size="13">Deterministic, sub-second repository compilation for LLM Agents</text>

  <!-- Step 1 -->
  <g transform="translate(35, 70)">
    <rect width="215" height="210" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="24" rx="6" fill="#1E293B"/>
    <text x="24" y="33" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="13" font-weight="700">01</text>
    <text x="16" y="64" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Git-Aware Scanner</text>
    <text x="16" y="90" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Respects .gitignore</text>
    <text x="16" y="110" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Skips lockfiles &amp; binaries</text>
    <text x="16" y="130" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Secret &amp; API Key redactor</text>
    <text x="16" y="150" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• BPE Token estimator</text>
    <rect x="16" y="168" width="183" height="26" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="26" y="185" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">~1,500 files / sec</text>
  </g>

  <line x1="250" y1="175" x2="282" y2="175" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(290, 70)">
    <rect width="235" height="210" rx="12" fill="url(#cardBg)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="16" y="16" width="32" height="24" rx="6" fill="#0C4A6E"/>
    <text x="24" y="33" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="13" font-weight="700">02</text>
    <text x="16" y="64" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Dependency PageRank</text>
    <text x="16" y="90" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Cross-file import graph</text>
    <text x="16" y="110" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• PageRank centrality (d=0.85)</text>
    <text x="16" y="130" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Blast-radius impact score</text>
    <text x="16" y="150" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Entrypoint &amp; core detection</text>
    <rect x="16" y="168" width="203" height="26" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="26" y="185" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11">Ranks architectural gravity</text>
  </g>

  <line x1="525" y1="175" x2="557" y2="175" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(565, 70)">
    <rect width="245" height="210" rx="12" fill="url(#cardBg)" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="16" y="16" width="32" height="24" rx="6" fill="#312E81"/>
    <text x="24" y="33" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="13" font-weight="700">03</text>
    <text x="16" y="64" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Multi-Tier AST Compiler</text>
    <text x="16" y="90" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="11">• Tier 1: FULL (Core logic)</text>
    <text x="16" y="110" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11">• Tier 2: SKELETON (Signatures)</text>
    <text x="16" y="130" fill="#C7D2FE" font-family="ui-monospace, monospace" font-size="11">• Tier 3: SUMMARY (Symbol Map)</text>
    <text x="16" y="150" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Exact Token Budget Knapsack</text>
    <rect x="16" y="168" width="213" height="26" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <text x="26" y="185" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="11">-68% to -82% token reduction</text>
  </g>

  <line x1="810" y1="175" x2="842" y2="175" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(850, 70)">
    <rect width="215" height="210" rx="12" fill="url(#cardBg)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="16" y="16" width="32" height="24" rx="6" fill="#064E3B"/>
    <text x="24" y="33" fill="#34D399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">04</text>
    <text x="16" y="64" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Outputs &amp; Surfaces</text>
    <text x="16" y="90" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Cache-Pinned XML / MD</text>
    <text x="16" y="110" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Interactive X-Ray Studio</text>
    <text x="16" y="130" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• Built-in MCP Stdio Server</text>
    <text x="16" y="150" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">• CI Token Budget Guard</text>
    <rect x="16" y="168" width="183" height="26" rx="6" fill="#064E3B" fill-opacity="0.35" stroke="#10B981"/>
    <text x="26" y="185" fill="#34D399" font-family="ui-monospace, monospace" font-size="11">94% Prefix Cache Hit</text>
  </g>
</svg>
