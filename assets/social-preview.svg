<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="ctxray v1.0 OpenGraph Social Preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="55%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="82%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131C31"/>
      <stop offset="100%" stop-color="#0B101E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Background & Glows -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#cyanGlow)"/>
  <rect width="1280" height="640" fill="url(#violetGlow)"/>

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="1280" height="5" fill="url(#titleGrad)"/>

  <!-- Outer Frame -->
  <rect x="36" y="36" width="1208" height="568" rx="20" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Column: Brand & Value Prop -->
  <!-- Release Pill -->
  <rect x="76" y="78" width="276" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <circle cx="96" cy="95" r="5" fill="#34D399"/>
  <text x="110" y="100" class="mono" font-size="13" font-weight="700" fill="#E2E8F0">ctxray v1.0 • ZERO-DEPS CLI</text>

  <!-- Logo Icon + Wordmark -->
  <g transform="translate(76, 134)">
    <rect x="0" y="0" width="84" height="84" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <!-- X-Ray AST Prism Graph -->
    <line x1="24" y1="24" x2="60" y2="24" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="42" y1="24" x2="24" y2="60" stroke="#818CF8" stroke-width="2.5"/>
    <line x1="42" y1="24" x2="60" y2="60" stroke="#34D399" stroke-width="2.5"/>
    <line x1="24" y1="60" x2="60" y2="60" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="24" cy="24" r="6" fill="#38BDF8"/>
    <circle cx="60" cy="24" r="6" fill="#38BDF8"/>
    <circle cx="42" cy="40" r="7" fill="#A855F7"/>
    <circle cx="24" cy="60" r="6" fill="#34D399"/>
    <circle cx="60" cy="60" r="6" fill="#34D399"/>

    <text x="104" y="65" class="sans" font-size="76" font-weight="900" letter-spacing="-2" fill="url(#titleGrad)">ctxray</text>
  </g>

  <!-- Tagline -->
  <text x="76" y="266" class="sans" font-size="25" font-weight="700" fill="#F8FAFC">
    Surgical Codebase X-Ray &amp; Token Budget Compiler
  </text>
  <text x="76" y="302" class="mono" font-size="15.5" font-weight="600" fill="#38BDF8">
    AST Context Compiler • Dependency PageRank • Agent Flight Recorder • MCP Server
  </text>

  <!-- Description Copy -->
  <text x="76" y="346" class="sans" font-size="17" fill="#94A3B8">
    Stop blowing 150k+ tokens on raw repository dumps. Rank architectural hubs via
  </text>
  <text x="76" y="372" class="sans" font-size="17" fill="#94A3B8">
    weighted Dependency PageRank, skeletonize middle-tier AST signatures, and pack
  </text>
  <text x="76" y="398" class="sans" font-size="17" fill="#94A3B8">
    deterministic prefix-cached prompts for Claude Code, Codex, and Cursor.
  </text>

  <!-- 4 Metric Cards -->
  <g transform="translate(76, 434)">
    <rect x="0" y="0" width="150" height="82" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="36" class="mono" font-size="26" font-weight="800" fill="#34D399">-78.5%</text>
    <text x="18" y="60" class="sans" font-size="13" font-weight="600" fill="#94A3B8">Token Footprint</text>

    <rect x="164" y="0" width="150" height="82" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="182" y="36" class="mono" font-size="26" font-weight="800" fill="#38BDF8">94.2%</text>
    <text x="182" y="60" class="sans" font-size="13" font-weight="600" fill="#94A3B8">Prefix Cache Hit</text>

    <rect x="328" y="0" width="150" height="82" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="346" y="36" class="mono" font-size="24" font-weight="800" fill="#A78BFA">O(V + E)</text>
    <text x="346" y="60" class="sans" font-size="13" font-weight="600" fill="#94A3B8">Tarjan SCC Cycles</text>

    <rect x="492" y="0" width="150" height="82" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="510" y="36" class="mono" font-size="24" font-weight="800" fill="#FBBF24">JSON-RPC</text>
    <text x="510" y="60" class="sans" font-size="13" font-weight="600" fill="#94A3B8">Live MCP Server</text>
  </g>

  <!-- Bottom CLI Command Bar -->
  <rect x="76" y="538" width="642" height="40" rx="8" fill="#090D16" stroke="#334155" stroke-width="1"/>
  <text x="94" y="563" class="mono" font-size="14" fill="#E2E8F0">
    <tspan fill="#34D399" font-weight="700">$</tspan> npx ctxray rank . --budget 32k   <tspan fill="#475569">│</tspan>   <tspan fill="#38BDF8">npx ctxray mcp</tspan>   <tspan fill="#475569">│</tspan>   <tspan fill="#A78BFA">npx ctxray init-rules .</tspan>
  </text>

  <!-- Right Column: Architectural Compiler Visualization Panel -->
  <g transform="translate(756, 72)">
    <rect x="0" y="0" width="452" height="506" rx="16" fill="#090E1A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Panel Header -->
    <rect x="0" y="0" width="452" height="42" rx="16" fill="#111827"/>
    <circle cx="22" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="38" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="54" cy="21" r="5" fill="#27C93F"/>
    <text x="236" y="25" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#94A3B8">MULTI-TIER KNAPSACK COMPILER</text>

    <!-- Tier 1: FULL -->
    <g transform="translate(20, 58)">
      <rect x="0" y="0" width="412" height="94" rx="10" fill="#064E3B" fill-opacity="0.25" stroke="#10B981" stroke-width="1.2"/>
      <rect x="14" y="14" width="68" height="22" rx="4" fill="#065F46"/>
      <text x="48" y="29" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#34D399">[FULL]</text>
      <text x="94" y="29" class="mono" font-size="12.5" font-weight="700" fill="#F8FAFC">PageRank &gt;= 0.090 (Core Hubs)</text>
      <text x="396" y="29" text-anchor="end" class="mono" font-size="11.5" fill="#34D399">100% Tokens</text>
      <text x="14" y="54" class="mono" font-size="11.5" fill="#CBD5E1">src/core/graph-engine.ts        PR: 0.1482   4,120 tok</text>
      <text x="14" y="74" class="mono" font-size="11.5" fill="#CBD5E1">src/compiler/knapsack-packer.ts PR: 0.1194   3,480 tok</text>
    </g>

    <!-- Tier 2: SKELETON -->
    <g transform="translate(20, 166)">
      <rect x="0" y="0" width="412" height="106" rx="10" fill="#451A03" fill-opacity="0.28" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="14" y="14" width="88" height="22" rx="4" fill="#78350F"/>
      <text x="58" y="29" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FBBF24">[SKELETON]</text>
      <text x="114" y="29" class="mono" font-size="12.5" font-weight="700" fill="#F8FAFC">AST Signatures + Types Only</text>
      <text x="396" y="29" text-anchor="end" class="mono" font-size="11.5" fill="#FBBF24">-83.5% Tokens</text>
      <text x="14" y="54" class="mono" font-size="11" fill="#94A3B8">export class TsAstScanner {</text>
      <text x="14" y="72" class="mono" font-size="11" fill="#E2E8F0">  public extractContracts(sf: SourceFile): ModuleIR /* {...} */</text>
      <text x="14" y="90" class="mono" font-size="11" fill="#94A3B8">}</text>
    </g>

    <!-- Tier 3: SUMMARY -->
    <g transform="translate(20, 286)">
      <rect x="0" y="0" width="412" height="82" rx="10" fill="#2E1065" fill-opacity="0.28" stroke="#8B5CF6" stroke-width="1.2"/>
      <rect x="14" y="14" width="84" height="22" rx="4" fill="#4C1D95"/>
      <text x="56" y="29" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#C4B5FD">[SUMMARY]</text>
      <text x="110" y="29" class="mono" font-size="12.5" font-weight="700" fill="#F8FAFC">Peripheral Leaf Modules</text>
      <text x="396" y="29" text-anchor="end" class="mono" font-size="11.5" fill="#C4B5FD">-94.4% Tokens</text>
      <text x="14" y="54" class="mono" font-size="11" fill="#CBD5E1">Exports: formatAnsiTable, renderSparkline, colorizeTier</text>
      <text x="14" y="71" class="mono" font-size="11" fill="#64748B">In-degree: 1 │ Out-degree: 0 │ Churn Score: 0.08 (Stable)</text>
    </g>

    <!-- Flight Recorder & Prefix Cache Footer inside Right Panel -->
    <g transform="translate(20, 382)">
      <rect x="0" y="0" width="412" height="104" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="16" y="24" class="mono" font-size="11.5" font-weight="700" fill="#38BDF8">⚡ DETERMINISTIC PREFIX CACHE &amp; FLIGHT RECORDER</text>
      <!-- Progress Bar -->
      <rect x="16" y="36" width="380" height="14" rx="7" fill="#1E293B"/>
      <rect x="16" y="36" width="358" height="14" rx="7" fill="url(#titleGrad)"/>
      <text x="16" y="68" class="mono" font-size="11.5" fill="#E2E8F0">Anthropic <tspan fill="#34D399">cache_control: ephemeral</tspan> │ OpenAI <tspan fill="#38BDF8">prompt_cache_key</tspan></text>
      <text x="16" y="88" class="mono" font-size="11.5" fill="#94A3B8">Flight Log: <tspan fill="#F8FAFC">148,400 → 31,900 tok</tspan> • Zero Hallucinated Imports</text>
    </g>
  </g>
</svg>