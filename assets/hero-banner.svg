      <text x="12" y="22" fill="#A7F3D0" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Tier 1: Core Hotspots [FULL]</text>
      <text x="12" y="40" fill="#34D399" font-family="ui-monospace, monospace" font-size="11">16,400 tok • Top PageRank</text>
      <text x="12" y="64" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10">✓ Full implementation preserved</text>
      <text x="12" y="80" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10">✓ Pinned for prefix caching</text>
      <text x="12" y="96" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10">✓ Call-graph blast radius mapped</text>

      <rect x="225" y="0" width="155" height="110" rx="6" fill="#0C4A6E" fill-opacity="0.55" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="235" y="22" fill="#BAE6FD" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Tier 2: [SKELETON]</text>
      <text x="235" y="40" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">11,800 tok (-76%)</text>
      <text x="235" y="64" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="10">✓ AST Signatures</text>
      <text x="235" y="80" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="10">✓ Types &amp; Docstrings</text>
      <text x="235" y="96" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="10">✓ Bodies folded</text>

      <rect x="390" y="0" width="80" height="110" rx="6" fill="#312E81" fill-opacity="0.55" stroke="#818CF8" stroke-width="1.2"/>
      <text x="398" y="22" fill="#E0E7FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Tier 3</text>
      <text x="398" y="38" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="10">[INDEX]</text>
      <text x="398" y="60" fill="#C7D2FE" font-family="ui-monospace, monospace" font-size="10">3,700 tok</text>
      <text x="398" y="80" fill="#818CF8" font-family="ui-monospace, monospace" font-size="9">Exports &amp;</text>
      <text x="398" y="93" fill="#818CF8" font-family="ui-monospace, monospace" font-size="9">Git Diff</text>
    </g>

    <!-- Metrics Footer -->
    <g transform="translate(20, 184)">
      <rect width="470" height="44" rx="8" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-opacity="0.5"/>
      <text x="16" y="27" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="12" font-weight="600">✓ Cost: $0.05/turn   ✓ Cache Hit: 94%   ✓ 100% Type &amp; Call-Graph Recall</text>
