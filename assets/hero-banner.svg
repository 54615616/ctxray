    <g transform="translate(20, 184)">
      <rect width="470" height="44" rx="8" fill="#111827" stroke="#1F2937"/>
      <text x="16" y="27" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="12">✗ Cost: $0.74/turn   ✗ Cache Hit: 11%   ✗ "Lost-in-the-Middle" Hallucinations</text>
    </g>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(583, 350)">
    <circle cx="17" cy="17" r="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <path d="M11 17 L23 17 M18 12 L23 17 L18 22" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Right Card: ctxray Compiled Context (The Solution) -->
  <g transform="translate(630, 245)">
    <rect width="510" height="245" rx="14" fill="#0B0F17" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect width="510" height="42" rx="14" fill="url(#safeGrad)"/>
    <circle cx="22" cy="21" r="6" fill="#10B981" filter="url(#glow)"/>
