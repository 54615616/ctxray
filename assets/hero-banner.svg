    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="250" height="110" rx="6" fill="#7F1D1D" fill-opacity="0.45" stroke="#EF4444" stroke-width="1"/>
      <text x="12" y="24" fill="#FECACA" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Boilerplate &amp; Function Bodies</text>
      <text x="12" y="44" fill="#F87171" font-family="ui-monospace, monospace" font-size="11">92,100 tokens (62.1% wasted)</text>
      <text x="12" y="68" fill="#991B1B" font-family="ui-monospace, monospace" font-size="10">1,400 lines of internal loops, SQL</text>
      <text x="12" y="84" fill="#991B1B" font-family="ui-monospace, monospace" font-size="10">strings &amp; repetitive error handlers</text>

      <rect x="260" y="0" width="210" height="58" rx="6" fill="#78350F" fill-opacity="0.45" stroke="#F59E0B" stroke-width="1"/>
      <text x="272" y="22" fill="#FDE68A" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Low-Centrality &amp; Tests</text>
      <text x="272" y="40" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11">38,200 tokens (25.7%)</text>

      <rect x="260" y="66" width="210" height="44" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="1"/>
      <text x="272" y="86" fill="#A7F3D0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Core Architecture (12.2%)</text>
      <text x="272" y="101" fill="#34D399" font-family="ui-monospace, monospace" font-size="10">18,100 tokens of actual signal</text>
    </g>

