<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="540" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="538" rx="19" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Pill Badge -->
  <g transform="translate(60, 42)">
    <rect width="380" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="18" cy="15" r="5" fill="#34D399" filter="url(#glow)"/>
    <text x="34" y="20" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.5">ZERO-DEP CLI  •  MCP SERVER  •  VISUAL X-RAY STUDIO</text>
  </g>

  <!-- Brand Title & Subtitle -->
  <g transform="translate(60, 125)">
    <!-- X-Ray Icon -->
    <g transform="translate(0, -42)">
      <rect width="56" height="56" rx="14" fill="#0F172A" stroke="url(#brandGrad)" stroke-width="2.5"/>
      <path d="M14 18 L28 28 L14 38 M42 18 L28 28 L42 38" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="28" cy="28" r="5" fill="#34D399"/>
      <line x1="8" y1="28" x2="48" y2="28" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    </g>
    <text x="74" y="2" fill="url(#brandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="54" font-weight="900" letter-spacing="-1.5">ctxray</text>
    <text x="260" y="-6" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="500">v1.0</text>

    <text x="0" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700">See what your AI sees. Compile repos into high-signal context.</text>
    <text x="0" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">AST Skeleton Compression • PageRank Token Budgeting • 94% Prompt-Cache Ordering • Secret Redaction</text>
  </g>

  <!-- Left Card: Naive Repo Dump (The Problem) -->
  <g transform="translate(60, 245)">
    <rect width="510" height="245" rx="14" fill="#0B0F17" stroke="#EF4444" stroke-width="1.2" stroke-opacity="0.45"/>
    <rect width="510" height="42" rx="14" fill="url(#dangerGrad)"/>
    <circle cx="22" cy="21" r="6" fill="#EF4444"/>
    <text x="38" y="26" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">BEFORE: RAW REPO DUMP (repomix / concat)</text>
    <text x="415" y="26" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">148,400 tok</text>

